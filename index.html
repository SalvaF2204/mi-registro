<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E5B45">
<title>Mi registro de comidas</title>
<style>
:root{
  --ground:#F5F6F1; --surface:#FFFFFF; --surface-2:#FAFBF7; --surface-3:#EEF1EA;
  --ink:#16201B; --ink-2:#5A6660; --ink-3:#8A968F;
  --line:#DEE3DA; --line-strong:#C6CEC1;
  --accent:#1E5B45; --accent-ink:#FFFFFF; --accent-soft:#E2EFE8; --accent-line:#B6D6C6;
  --warn:#B06E06; --warn-soft:#FBEFD9;
  --r:12px; --r-sm:9px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0F1512; --surface:#18201C; --surface-2:#1D2621; --surface-3:#242E28;
    --ink:#E7ECE7; --ink-2:#97A39C; --ink-3:#6E7C74;
    --line:#2A342E; --line-strong:#3A473F;
    --accent:#5FBF93; --accent-ink:#08130D; --accent-soft:#1B2E25; --accent-line:#2E5243;
    --warn:#DFA53C; --warn-soft:#2C2313;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:23px;line-height:1.2;margin:0 0 4px;font-weight:650}
.sub{color:var(--ink-2);font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.meta{background:var(--accent-soft);border-color:var(--accent-line)}
.aviso{background:var(--warn-soft);border-color:transparent}
.dias{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin-top:14px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.otro{position:relative;display:inline-flex;align-items:center;gap:6px}
.otro input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.comida-h{display:flex;align-items:center;gap:10px}
.comida-h b{font-size:17.5px;flex:1}
input[type=time]{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);min-height:40px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{margin-top:8px}
.item span{flex:1}
.item small{display:block;color:var(--ink-3);font-size:13.5px}
.x{border:0;background:none;color:var(--ink-3);font-size:24px;width:44px;height:44px;cursor:pointer;flex:none}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;font:inherit;font-size:15.5px;cursor:pointer;min-height:46px}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-full{width:100%;margin-top:10px}
.q{margin-top:14px;font-size:14.5px;color:var(--ink-2)}
.opc{color:var(--ink-3);font-size:13px}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ops .chip{min-height:38px;padding:6px 12px;font-size:14px}
.grupos{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.g{border-radius:999px;padding:6px 11px;font-size:14px}
.g.si{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.g.no{border:1px dashed var(--line-strong);color:var(--ink-3)}
.nums{margin-top:12px;display:grid;gap:4px}
.nota{font-size:13.5px;color:var(--ink-3);margin-top:12px}
.pie{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.pie:empty{display:none}
.pie .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.sheet-h b{flex:1;font-size:17.5px}
.sheet-b{overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));flex:1}
.buscar{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink)}
.eti{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 2px}
.res{padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.res.sel{background:var(--surface-3);padding-left:10px;padding-right:10px}
.res small{display:block;color:var(--ink-3);font-size:13.5px}
.res.libre b{font-weight:600}
.porc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 15px;border-radius:999px;font-size:14.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>

/* ---------- Utilidades ---------- */
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=> String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const isoDe = d=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoyISO = ()=> isoDe(new Date());
const DSEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const ddmm = f=> f.slice(8,10)+'/'+f.slice(5,7);
const fechaLarga = f=> DSEM[new Date(f+'T12:00:00').getDay()]+' '+ddmm(f);
function nombreDia(f){
  if (f === hoyISO()) return 'Hoy';
  const ay = new Date(); ay.setDate(ay.getDate()-1);
  if (f === isoDe(ay)) return 'Ayer';
  return DSEM[new Date(f+'T12:00:00').getDay()].slice(0,3)+' '+ddmm(f);
}
function fechaHora(iso){ const d = new Date(iso); return ddmm(isoDe(d))+' a las '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const frac = p=> p === 0.5 ? '½' : p === 1.5 ? '1½' : String(p);
const cant = (p, uni)=> frac(p)+' '+(p > 1 ? uni[1] : uni[0]);
const unidadPlato = r=> r[1] === 'alm' ? U_PLATO : U_PORC;
const porcionSola = med=> /^1 porci[oó]n$/i.test(med);
const nombreComida = id=> (COMIDAS.filter(c=> c[0] === id)[0]||[id, id])[1];
let toastT = null;

/* ---------- Lo anotado ---------- */
function diaDe(f, crear){ if (!S.dias[f] && crear) S.dias[f] = {comidas:{}, extra:[]}; return S.dias[f] || null; }
function comidaDe(f, id, crear){
  const d = diaDe(f, crear); if (!d) return null;
  if (!d.comidas[id] && crear) d.comidas[id] = {e:[]};
  return d.comidas[id] || null;
}
const conAlgo = c=> !!(c && (c.e||[]).length);
function comidasDelDia(f){
  const d = diaDe(f), extra = d ? d.extra||[] : [];
  return COMIDAS.map(c=> c[0]).filter(id=> CFG.c.indexOf(id) >= 0 || extra.indexOf(id) >= 0 || (d && conAlgo(d.comidas[id])));
}
function limpiar(f){
  const d = diaDe(f); if (!d) return;
  Object.keys(d.comidas).forEach(id=>{ if (!conAlgo(d.comidas[id]) && !d.comidas[id].hora) delete d.comidas[id]; });
  if (!Object.keys(d.comidas).length && !(d.extra||[]).length) delete S.dias[f];
}
const fechasConAlgo = ()=> Object.keys(S.dias).filter(f=> Object.keys(S.dias[f].comidas).some(id=> conAlgo(S.dias[f].comidas[id]))).sort();

function nombreEntrada(e){
  if (e.t != null) return e.t;
  if (e.i != null) return e.i;
  if (e.r != null) return DATOS.R[e.r][0];
  return DATOS.A[e.a][0];
}
function cantEntrada(e, corta){
  if (e.t != null) return corta ? '' : 'anotado a mano';
  if (e.i != null) return corta ? '' : 'sin calorías';
  if (e.r != null) return cant(e.p, unidadPlato(DATOS.R[e.r]));
  const med = DATOS.A[e.a][2];
  return corta || porcionSola(med) ? cant(e.p, U_PORC) : (e.p === 1 ? med : cant(e.p, U_PORC)+' de '+med);
}
/* Totales del día: sólo para los grupos y, si el nutri los activó, los números elegidos */
function totalesDia(f){
  const t = {p:0, h:0, f:0, k:0, gapa:{}, hay:false, textos:0};
  const suma = (i, g)=>{ const a = DATOS.A[i]; if (!a) return; const x = g/100;
    t.k += a[4]*x; t.p += a[5]*x; t.h += a[6]*x; t.f += a[7]*x; if (a[1]) t.gapa[a[1]] = true; };
  const d = diaDe(f); if (!d) return t;
  Object.keys(d.comidas).forEach(id=> (d.comidas[id].e||[]).forEach(e=>{
    t.hay = true;
    if (e.t != null){ t.textos++; return; }
    if (e.i != null) return;
    if (e.r != null){ DATOS.R[e.r][2].forEach(x=> suma(x[0], x[1]*e.p)); return; }
    suma(e.a, DATOS.A[e.a][3]*e.p);
  }));
  return t;
}

/* ---------- El mensaje para el nutri ---------- */
/* Base64 común y no la variante para URLs: WhatsApp usa los guiones bajos para poner cursiva */
const b64 = s=> btoa(unescape(encodeURIComponent(s)));
function codigo(fechas){
  const d = fechas.map(f=> [f, comidasDelDia(f).map(id=>{
    const c = comidaDe(f, id); if (!conAlgo(c)) return null;
    return [id, c.hora||'', c.hambre||0, c.saciedad||0, c.ctx||[], c.e.map(e=>
      e.t != null ? ['t', e.t] : e.i != null ? ['i', e.i] : e.r != null ? ['r', DATOS.R[e.r][0], e.p]
        : ['a', e.a, e.p, Math.round(DATOS.A[e.a][3]*e.p)])];
  }).filter(Boolean)]);
  return 'NUTRI1.'+CFG.k+'.'+b64(JSON.stringify({v:1, d:d}));
}
function mensaje(){
  const fechas = fechasConAlgo(); if (!fechas.length) return null;
  let txt = 'Mi registro de comidas ('+fechas.length+(fechas.length === 1 ? ' día' : ' días')+')\n';
  fechas.forEach(f=>{
    txt += '\n'+fechaLarga(f)+'\n';
    comidasDelDia(f).forEach(id=>{
      const c = comidaDe(f, id); if (!conAlgo(c)) return;
      txt += '• '+nombreComida(id)+(c.hora ? ' ('+c.hora+')' : '')+': '+
        c.e.map(e=>{ const q = cantEntrada(e, true); return nombreEntrada(e)+(q ? ' ('+q+')' : ''); }).join(', ')+'\n';
    });
  });
  return txt+'\nCódigo para Nutrimétrica, no hace falta tocarlo:\n'+codigo(fechas);
}
function marcarEnviado(){ S.enviado = new Date().toISOString(); guardar(); render(); }
function enviar(){
  const txt = mensaje(); if (!txt){ toast('Todavía no anotaste nada'); return; }
  marcarEnviado();
  location.href = 'https://wa.me/'+CFG.w+'?text='+encodeURIComponent(txt);
}
function copiar(){
  const txt = mensaje(); if (!txt){ toast('Todavía no anotaste nada'); return; }
  const ok = ()=>{ marcarEnviado(); toast('Copiado: pegalo en el chat con tu nutri'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, ()=> copiarAMano(txt, ok));
  else copiarAMano(txt, ok);
}
function copiarAMano(txt, ok){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  let hecho = false; try{ hecho = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if (hecho) ok(); else toast('No se pudo copiar: usá el botón de WhatsApp');
}

  const lista = comidasDelDia(DIA);
  h += lista.map(id=> comidaHTML(DIA, id)).join('');
  const faltan = COMIDAS.map(c=> c[0]).filter(id=> lista.indexOf(id) < 0);
  if (faltan.length) h += '<div class="q">¿Comiste algo en otro momento?</div><div class="ops">'+
    faltan.map(id=> '<button class="chip" data-extra="'+id+'">+ '+nombreComida(id)+'</button>').join('')+'</div>';
  if (CFG.n !== 'solo') h += resumenHTML(DIA);
  if (S.enviado) h += '<div class="nota">Lo mandaste el '+fechaHora(S.enviado)+'. Si anotás algo más, mandalo otra vez: tu nutri lo actualiza solo.</div>';
  h += '<div class="nota">Lo que anotás queda sólo en este teléfono hasta que se lo mandás a tu nutri.</div>';
  app.innerHTML = h;
  pie.innerHTML = '<div class="in"><button class="btn btn-p" data-enviar="1" style="flex:1">Mandar a mi nutri</button><button class="btn" data-copiar="1">Copiar</button></div>';
}
function diasVisibles(){ const s = new Set(fechasConAlgo()); s.add(hoyISO()); s.add(DIA); return Array.from(s).sort(); }
function comidaHTML(f, id){
  const c = comidaDe(f, id) || {e:[]}, nm = nombreComida(id), e = c.e||[];
  let h = '<section class="card"><div class="comida-h"><b>'+nm+'</b>'+
    '<input type="time" data-hora="'+id+'" value="'+esc(c.hora||'')+'" aria-label="Hora de '+esc(nm.toLowerCase())+'"></div>';
  h += e.map((x, i)=> '<div class="item"><span>'+esc(nombreEntrada(x))+'<small>'+esc(cantEntrada(x))+'</small></span>'+
    '<button class="x" data-quitar="'+id+'" data-i="'+i+'" aria-label="Quitar '+esc(nombreEntrada(x))+'">×</button></div>').join('');
  h += '<button class="btn btn-full" data-agregar="'+id+'">+ '+(e.length ? 'Agregar algo más' : 'Anotar lo que comí')+'</button>';
  if (e.length) h += pregunta('¿Con cuánta hambre llegaste?', id, 'hambre', HAMBRE, c.hambre)+
    pregunta('¿Cómo quedaste?', id, 'saciedad', SACIEDAD, c.saciedad)+
    '<div class="q">¿Algo más? <span class="opc">opcional</span></div><div class="ops">'+CONTEXTOS.map(x=>
      '<button class="chip" data-ctx="'+id+'" data-k="'+x[0]+'" aria-pressed="'+((c.ctx||[]).indexOf(x[0]) >= 0)+'">'+x[1]+'</button>').join('')+'</div>';
  return h+'</section>';
}
function pregunta(txt, id, campo, ops, val){
  return '<div class="q">'+txt+'</div><div class="ops" role="group" aria-label="'+esc(txt)+'">'+ops.map(o=>
    '<button class="chip" data-'+campo+'="'+id+'" data-v="'+o[0]+'" aria-pressed="'+(val === o[0])+'">'+o[1]+'</button>').join('')+'</div>';
}
function resumenHTML(f){
  const t = totalesDia(f); if (!t.hay) return '';
  let h = '<div class="card"><b>Lo que sumaste '+(f === hoyISO() ? 'hoy' : 'ese día')+'</b><div class="grupos">'+
    GAPA.map(g=> '<span class="g '+(t.gapa[g[0]] ? 'si' : 'no')+'">'+g[1]+'</span>').join('')+'</div>';
  const ks = CFG.n === 'numeros' ? Object.keys(CFG.t) : [];
  if (ks.length) h += '<div class="nums">'+ks.map(k=> '<div>'+NUMS[k][0]+': <b>'+Math.round(t[k]).toLocaleString('es-AR')+' '+NUMS[k][1]+'</b>'+
    ' <span class="sub">· tu meta, '+CFG.t[k].toLocaleString('es-AR')+' '+NUMS[k][1]+'</span></div>').join('')+'</div>';
  if (t.textos) h += '<div class="nota">Lo que anotaste a mano lo suma tu nutri después.</div>';
  return h+'</div>';
}

/* ---------- Hoja para anotar: buscar y elegir la porción ---------- */
const IDX = {
  alim: DATOS.A.map((r, i)=> ({tipo:'a', i:i, n:r[0], b:norm(r[0]), sub: porcionSola(r[2]) ? 'Una porción común' : '1 porción = '+r[2]})),
  platos: DATOS.R.map((r, i)=> ({tipo:'r', i:i, n:r[0], b:norm(r[0]),
    sub:'Plato: '+r[2].slice(0,3).map(x=> String((DATOS.A[x[0]]||[''])[0]).toLowerCase()).join(', ')+(r[2].length > 3 ? '…' : '')})),
  inf: INFUSIONES.map((n, i)=> ({tipo:'i', i:i, n:n, b:norm(n), sub:'Sin calorías. Si le pusiste leche o azúcar, agregalos aparte.'}))
};
function abrirHoja(id){
  HOJA = {id:id, q:'', sel:null}; renderHoja();
  const q = document.getElementById('q'); if (q) setTimeout(()=> q.focus(), 60);
}
function cerrarHoja(){ HOJA = null; document.getElementById('hoja').innerHTML = ''; render(); }
function yaAnotado(){ const c = comidaDe(DIA, HOJA.id); return conAlgo(c) ? 'Ya anotaste: '+c.e.map(nombreEntrada).join(', ') : ''; }
function renderHoja(){
  const el = document.getElementById('hoja');
  if (!HOJA){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Anotar en '+esc(nombreComida(HOJA.id).toLowerCase())+'">'+
    '<div class="sheet-h"><b>'+esc(nombreComida(HOJA.id))+(DIA !== hoyISO() ? ' · '+nombreDia(DIA) : '')+'</b><button class="btn" data-cerrar="1">Listo</button></div>'+
    '<div class="sheet-b"><input class="buscar" id="q" type="search" enterkeyhint="search" placeholder="Qué comiste: pan, yogur, milanesa…" value="'+esc(HOJA.q)+'" autocomplete="off">'+
    '<div id="ya" class="nota">'+esc(yaAnotado())+'</div><div id="resultados">'+resultadosHTML()+'</div></div></div></div>';
}
function refrescarResultados(){
  const r = document.getElementById('resultados'); if (r) r.innerHTML = resultadosHTML();
  const ya = document.getElementById('ya'); if (ya) ya.textContent = yaAnotado();
}
function resultadosHTML(){
  const q = norm(HOJA.q.trim());
  if (!q){
    const rec = recientes(HOJA.id), pl = IDX.platos.filter(x=> DATOS.R[x.i][1] === TIPO_COMIDA[HOJA.id]).slice(0, 6);
    return (rec.length ? '<div class="eti">Lo que ya anotaste otras veces</div>'+rec.map(resHTML).join('') : '')+
      (pl.length ? '<div class="eti">Algunos platos</div>'+pl.map(resHTML).join('') : '')+
      '<div class="nota">Escribí lo que comiste y elegí de la lista. Si no está, lo podés anotar tal cual.</div>';
  }
  const pal = q.split(/\s+/).filter(Boolean), ok = x=> pal.every(w=> x.b.indexOf(w) >= 0);
  const A = IDX.alim.filter(ok).slice(0, 25), R = IDX.platos.filter(ok).slice(0, 10), I = IDX.inf.filter(ok);
  let h = '';
  if (A.length) h += '<div class="eti">Alimentos</div>'+A.map(resHTML).join('');
  if (R.length) h += '<div class="eti">Platos</div>'+R.map(resHTML).join('');
  if (I.length) h += '<div class="eti">Infusiones y bebidas sin calorías</div>'+I.map(resHTML).join('');
  if (!h) h = '<div class="nota">No está en la lista.</div>';
  return h+'<div class="res libre" data-texto="1"><b>Anotar tal cual: «'+esc(HOJA.q.trim())+'»</b>'+
    '<small>Por ejemplo, «2 porciones de pizza» o «1 alfajor». Tu nutri lo carga después.</small></div>';
}
function resHTML(x){
  const sel = HOJA.sel && HOJA.sel.tipo === x.tipo && HOJA.sel.i === x.i;
  let h = '<div class="res'+(sel ? ' sel' : '')+'" data-res="'+x.tipo+':'+x.i+'"><b>'+esc(x.n)+'</b><small>'+esc(x.sub)+'</small>';
  if (sel){
    const uni = x.tipo === 'r' ? unidadPlato(DATOS.R[x.i]) : U_PORC;
    h += '<div class="q">¿Cuánto comiste?</div><div class="porc">'+PORC.map(p=> '<button class="chip" data-porc="'+p+'">'+cant(p, uni)+'</button>').join('')+'</div>';
  }
  return h+'</div>';
}
/* Lo que ya anotó otros días, primero lo de esta misma comida: los desayunos se repiten mucho */
function recientes(id){
  const vistos = {}, L = [];
  Object.keys(S.dias).sort().reverse().forEach(f=>{
    const d = S.dias[f];
    [id].concat(Object.keys(d.comidas).filter(x=> x !== id)).forEach(cid=>{
      ((d.comidas[cid]||{}).e||[]).forEach(e=>{
        const x = e.r != null ? IDX.platos[e.r] : e.a != null ? IDX.alim[e.a] : e.i != null ? IDX.inf[INFUSIONES.indexOf(e.i)] : null;
        if (!x) return;
        const k = x.tipo+':'+x.i; if (vistos[k]) return; vistos[k] = 1; L.push(x);
      });
    });
  });
  return L.slice(0, 8);
}
function agregar(e){
  comidaDe(DIA, HOJA.id, true).e.push(e); guardar();
  HOJA.sel = null; HOJA.q = '';
  const q = document.getElementById('q'); if (q) q.value = '';
  refrescarResultados(); render(); toast('Anotado');
  if (q) q.focus();
}

/* ---------- Eventos ---------- */
const ACCIONES = '[data-agregar],[data-quitar],[data-hambre],[data-saciedad],[data-ctx],[data-dia],[data-extra],[data-enviar],[data-copiar],[data-cerrar],[data-porc],[data-res],[data-texto]';
document.addEventListener('click', ev=>{
  const t = ev.target;
  if (t.classList && t.classList.contains('sheet-bg')){ cerrarHoja(); return; }
  const b = t.closest ? t.closest(ACCIONES) : null; if (!b) return;
  const a = k=> b.getAttribute(k), tiene = k=> b.hasAttribute(k);
  if (tiene('data-agregar')){ abrirHoja(a('data-agregar')); return; }
  if (tiene('data-quitar')){ const c = comidaDe(DIA, a('data-quitar')); if (c){ c.e.splice(+a('data-i'), 1); limpiar(DIA); guardar(); render(); } return; }
  if (tiene('data-hambre') || tiene('data-saciedad')){
    const campo = tiene('data-hambre') ? 'hambre' : 'saciedad', c = comidaDe(DIA, a('data-'+campo), true), v = +a('data-v');
    if (c[campo] === v) delete c[campo]; else c[campo] = v;
    guardar(); render(); return;
  }
  if (tiene('data-ctx')){
    const c = comidaDe(DIA, a('data-ctx'), true), k = a('data-k'); c.ctx = c.ctx||[];
    const i = c.ctx.indexOf(k); if (i >= 0) c.ctx.splice(i, 1); else c.ctx.push(k);
    guardar(); render(); return;
  }
  if (tiene('data-dia')){ DIA = a('data-dia'); render(); window.scrollTo(0, 0); return; }
  if (tiene('data-extra')){ const d = diaDe(DIA, true); d.extra = d.extra||[]; if (d.extra.indexOf(a('data-extra')) < 0) d.extra.push(a('data-extra')); guardar(); render(); return; }
  if (tiene('data-enviar')){ enviar(); return; }
  if (tiene('data-copiar')){ copiar(); return; }
  if (tiene('data-cerrar')){ cerrarHoja(); return; }
  if (tiene('data-porc')){ const s = HOJA && HOJA.sel; if (s) agregar(s.tipo === 'r' ? {r:s.i, p:+a('data-porc')} : {a:s.i, p:+a('data-porc')}); return; }
  if (tiene('data-res')){
    const par = a('data-res').split(':'), tipo = par[0], i = +par[1];
    if (tipo === 'i'){ agregar({i:INFUSIONES[i]}); return; }
    HOJA.sel = (HOJA.sel && HOJA.sel.tipo === tipo && HOJA.sel.i === i) ? null : {tipo:tipo, i:i};
    refrescarResultados(); return;
  }
  if (tiene('data-texto')){ const txt = (HOJA.q||'').trim(); if (txt) agregar({t:txt.slice(0, 120)}); return; }
});
document.addEventListener('change', ev=>{
  const t = ev.target;
  if (t.hasAttribute && t.hasAttribute('data-hora')){
    const c = comidaDe(DIA, t.getAttribute('data-hora'), true);
    if (t.value) c.hora = t.value; else delete c.hora;
    limpiar(DIA); guardar(); return;
  }
  if (t.id === 'otroDia' && t.value && t.value <= hoyISO()){ DIA = t.value; render(); }
});
document.addEventListener('input', ev=>{ if (ev.target.id === 'q' && HOJA){ HOJA.q = ev.target.value; HOJA.sel = null; refrescarResultados(); } });
document.addEventListener('keydown', ev=>{ if (ev.key === 'Escape' && HOJA) cerrarHoja(); });

render();
</script>
